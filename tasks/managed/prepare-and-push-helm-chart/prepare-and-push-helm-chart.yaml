---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-and-push-helm-chart
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to process excluded artifacts and extract Helm charts for pushing.

    This task processes excluded artifacts from filter-snapshot task to extract Helm chart content.
    For each artifact in the excluded snapshot, if it's a Helm chart (config.mediaType == application/vnd.cncf.helm.config.v1+json),
    it pulls the artifact and extracts its content for further processing.
  params:
    - name: excludedSnapshotPath
      type: string
      description: Path to the snapshot file containing excluded artifacts
    - name: includedSnapshotPath
      type: string
      description: Path to the snapshot file containing included artifacts
    - name: resultsDirPath
      type: string
      description: Path to the results directory containing push-snapshot results
      default: ""
    - name: dataPath
      type: string
      description: Path to the data JSON file containing ReleasePlanAdmission mapping
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: $(workspaces.data.path)
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
      default: ""
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
      default: ""

  workspaces:
    - name: data
      description: The workspace where the snapshot and data JSON files reside

  results:
    - name: processedHelmCharts
      type: string
      description: List of processed Helm chart artifacts
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact

  volumes:
    - name: workdir
      emptyDir: {}

  stepTemplate:
    image: quay.io/konflux-ci/tools@sha256:8ceffcd5d33378b27ab3b8fb8ab40704c46bfebf5868f9415d481a1d5e3ff388
    env:
      - name: HOME
        value: /tekton/home
    workingDir: $(workspaces.data.path)
    volumeMounts:
      - name: workdir
        mountPath: /workdir

  steps:
    - name: create-data-dir
      image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
      computeResources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      script: |
        #!/usr/bin/env bash
        set -eo pipefail

        # Ensure the data directory exists before trusted artifacts operations
        echo "Creating data directory: $(params.dataDir)"
        mkdir -p "$(params.dataDir)"

    - name: skip-trusted-artifact-operations
      computeResources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 32Mi
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/skip-trusted-artifact-operations/skip-trusted-artifact-operations.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)

    - name: use-trusted-artifact
      computeResources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          memory: 64Mi
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)

    - name: process-helm-charts
      image: quay.io/konflux-ci/release-service-utils:9089cafbf36bb889b4b73d8c2965613810f13736
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
      script: |
        #!/usr/bin/env bash
        set -eux

        excluded_snapshot_file="$(params.dataDir)/$(params.excludedSnapshotPath)"
        included_snapshot_file="$(params.dataDir)/$(params.includedSnapshotPath)"
        push_results_file="$(params.dataDir)/$(params.resultsDirPath)/push-snapshot-results.json"

        # Load original snapshot (build-time images) and mapped snapshot (release-time images)
        original_snapshot_file="$(params.dataDir)/snapshot_spec.json.orig"
        mapped_snapshot_file="$(params.dataDir)/snapshot_spec.json"

        echo "Processing Helm charts from excluded snapshot: $excluded_snapshot_file"
        echo "Included snapshot reference: $included_snapshot_file"
        echo "Push results file: $push_results_file"
        echo "Original snapshot file: $original_snapshot_file"
        echo "Mapped snapshot file: $mapped_snapshot_file"

        # Create build-to-release image mapping
        build_to_release_mapping="{}"
        helm_chart_repository=""

        if [ -f "$original_snapshot_file" ] && [ -f "$mapped_snapshot_file" ]; then
          echo "📋 Creating build-to-release image mapping..."

          # Create mapping from build-time to release-time repositories
          build_to_release_mapping=$(jq -n '
            ($original | .components) as $original_components |
            ($mapped | .components) as $mapped_components |

            reduce range(0; $original_components | length) as $i ({};
              . + {
                ($original_components[$i].containerImage): {
                  "build_image": $original_components[$i].containerImage,
                  "build_repo": ($original_components[$i].containerImage | split("@")[0]),
                  "release_repo": ($mapped_components | map(select(.name == $original_components[$i].name)) | .[0].repository // ""),
                  "component_name": $original_components[$i].name
                }
              }
            )
          ' \
          --argjson original "$(cat "$original_snapshot_file")" \
          --argjson mapped "$(cat "$mapped_snapshot_file")")

          echo "🔄 Build-to-release mapping created:"
          echo "$build_to_release_mapping" | jq .

          # Try to derive Helm chart repository from ReleasePlanAdmission data
          data_file="$(params.dataDir)/$(params.dataPath)"
          if [ -f "$data_file" ]; then
            echo "📋 Looking for Helm chart repository in ReleasePlanAdmission data..."
            echo "🔍 Debug: Data file exists at: $data_file"

            # Debug: Show the structure of the data file
            echo "🔍 Debug: Data file keys:"
            jq 'keys' "$data_file" 2>/dev/null || echo "  (failed to parse data file as JSON)"

            echo "🔍 Debug: Mapping structure:"
            jq '.mapping' "$data_file" 2>/dev/null || echo "  (no .mapping key found)"

            echo "🔍 Debug: Available mapping components:"
            jq '.mapping.components[]? | .name' "$data_file" 2>/dev/null || echo "  (no .mapping.components found)"

            # Extract component name from excluded snapshot to find its repository mapping
            excluded_component_name=$(cat "$excluded_snapshot_file" | jq -r '.components[0].name // ""' 2>/dev/null || echo "")
            echo "🔍 Debug: Looking for component name: '$excluded_component_name'"

            if [ -n "$excluded_component_name" ]; then
              # Look for this component in the ReleasePlanAdmission mapping
              helm_chart_repository=$(jq -r --arg name "$excluded_component_name" \
                '.mapping.components[]? | select(.name == $name) | .repository // ""' \
                "$data_file" 2>/dev/null || echo "")

              echo "🔍 Debug: Repository lookup result: '$helm_chart_repository'"

              if [ -n "$helm_chart_repository" ]; then
                echo "✅ Found Helm chart repository in ReleasePlanAdmission: $helm_chart_repository"
              else
                echo "⚠️  Helm chart component '$excluded_component_name' not found in ReleasePlanAdmission mapping"
                echo "ℹ️  The Helm chart component must be added to the ReleasePlanAdmission mapping to enable repository push"
              fi
            fi
          else
            echo "⚠️  ReleasePlanAdmission data file not found: $data_file"
          fi
        else
          echo "⚠️  Original or mapped snapshot not found - will not be able to update image references in Helm charts"
        fi

        # Load push results if available
        push_results="{}"
        if [ -f "$push_results_file" ]; then
          push_results=$(cat "$push_results_file")
          echo "📋 Loaded push-snapshot results with $(echo "$push_results" | jq '.images | length') pushed components"
        else
          echo "⚠️  Push results file not found - will not have registry destination info"
        fi

        if [ ! -f "$excluded_snapshot_file" ]; then
          echo "Warning: Excluded snapshot file not found: $excluded_snapshot_file"
          echo -n "[]" > "$(results.processedHelmCharts.path)"
          exit 0
        fi

        excluded_snapshot=$(cat "$excluded_snapshot_file")
        components=$(echo "$excluded_snapshot" | jq -r '.components // []')

        if [ "$components" = "[]" ] || [ "$components" = "null" ]; then
          echo "No components found in excluded snapshot"
          echo -n "[]" > "$(results.processedHelmCharts.path)"
          exit 0
        fi

        component_count=$(echo "$components" | jq length)
        echo "Processing $component_count excluded components"

        processed_charts=[]

        for i in $(seq 0 $((component_count - 1))); do
          component=$(echo "$components" | jq ".[$i]")
          component_name=$(echo "$component" | jq -r '.name // "unknown"')
          container_image=$(echo "$component" | jq -r '.containerImage // ""')

          echo "Processing component: $component_name ($container_image)"

          # Get registry destination and digest info from push results
          registry_destinations=[]
          pushed_digest=""
          if [ "$push_results" != "{}" ]; then
            # Find matching component in push results
            push_info=$(echo "$push_results" | jq --arg name "$component_name" '.images[] | select(.name == $name) // empty')
            if [ -n "$push_info" ] && [ "$push_info" != "null" ]; then
              registry_destinations=$(echo "$push_info" | jq '.urls // []')
              pushed_digest=$(echo "$push_info" | jq -r '.shasum // ""')
              echo "  📦 Registry destinations: $(echo "$registry_destinations" | jq -r '. | join(", ")')"
              echo "  🔍 Pushed digest: $pushed_digest"
            else
              echo "  ⚠️  No push results found for component: $component_name"
            fi
          fi

          if [ -z "$container_image" ] || [ "$container_image" = "null" ]; then
            echo "  Skipping component without container image"
            continue
          fi

          echo "  Inspecting artifact with skopeo..."

          # Inspect without auth for now - we can add auth later if needed
          if ! inspect_result=$(skopeo inspect --retry-times 3 --no-tags --raw "docker://$container_image" 2>/dev/null); then
            echo "  Warning: Failed to inspect $container_image, skipping"
            continue
          fi

          media_type=$(echo "$inspect_result" | jq -r '.config.mediaType // ""')
          echo "  Media type: $media_type"

          if [ "$media_type" = "application/vnd.cncf.helm.config.v1+json" ]; then
            echo "  ✅ Found Helm chart: $component_name"

            # Extract Helm chart content
            echo "  📦 Extracting Helm chart content..."

            # Create temporary directory for extraction
            extract_dir=$(mktemp -d)
            chart_dir="$extract_dir/chart"

            # Copy the Helm chart artifact to a local directory
            if skopeo copy --retry-times 3 "docker://$container_image" "dir:$chart_dir" 2>/dev/null; then
              echo "  ✓ Successfully copied Helm chart artifact"

              # Look for the chart content layer (tar+gzip)
              if [ -d "$chart_dir" ]; then
                echo "  📁 Chart directory contents:"
                ls -la "$chart_dir" || echo "    (failed to list directory)"

                # Find and extract the chart content tarball
                chart_tarball=""
                for file in "$chart_dir"/*; do
                  if [ -f "$file" ]; then
                    # Check if this looks like a layer file (long hex name) and try to extract it
                    filename=$(basename "$file")
                    if [[ "$filename" =~ ^[a-f0-9]{64}$ ]]; then
                      chart_tarball="$file"
                      echo "  📦 Found chart layer file: $(basename "$file")"
                      break
                    fi
                  fi
                done

                if [ -n "$chart_tarball" ]; then
                  # Extract the tarball
                  extract_content_dir="$extract_dir/content"
                  mkdir -p "$extract_content_dir"

                  if tar -xzf "$chart_tarball" -C "$extract_content_dir" 2>/dev/null; then
                    echo "  ✓ Successfully extracted chart content"
                    echo "  📄 High-level chart files:"

                    # Show high-level file structure
                    find "$extract_content_dir" -maxdepth 2 -type f | head -10 | while read -r file; do
                      rel_path=$(echo "$file" | sed "s|$extract_content_dir/||")
                      echo "    - $rel_path"
                    done

                    # Show Chart.yaml content if it exists
                    chart_yaml=$(find "$extract_content_dir" -name "Chart.yaml" -o -name "chart.yaml" | head -1)
                    if [ -n "$chart_yaml" ]; then
                      echo "  📋 Chart.yaml content:"
                      sed 's/^/    /' "$chart_yaml" 2>/dev/null || echo "    (failed to read Chart.yaml)"
                    fi

                    # 🚀 UPDATE IMAGE REFERENCES IN HELM CHART
                    echo "  🔄 Updating image references from build-time to release-time repositories..."

                    updated_files_count=0

                    # Find all YAML files that might contain image references
                    find "$extract_content_dir" -name "*.yaml" -o -name "*.yml" | while read -r yaml_file; do
                      echo "    🔍 Checking file: $(echo "$yaml_file" | sed "s|$extract_content_dir/||")"

                      # Look for image references and update them using the mapping
                      if grep -q "image:" "$yaml_file" 2>/dev/null; then
                        echo "      📝 Found image references in file"

                        # Create backup
                        cp "$yaml_file" "$yaml_file.bak"

                        # Update image references using the build-to-release mapping
                        if [ "$build_to_release_mapping" != "{}" ]; then
                          # Extract all build repos from mapping
                          echo "$build_to_release_mapping" | jq -r 'to_entries[] | select(.value.release_repo != "") | "\(.value.build_repo) \(.value.release_repo)"' | while read -r build_repo release_repo; do
                            if [ -n "$build_repo" ] && [ -n "$release_repo" ]; then
                              echo "        🔄 Replacing $build_repo → $release_repo"
                              sed -i "s|$build_repo|$release_repo|g" "$yaml_file"
                            fi
                          done

                          # Check if file was actually modified
                          if ! cmp -s "$yaml_file" "$yaml_file.bak"; then
                            echo "      ✅ Updated image references in $(basename "$yaml_file")"
                            updated_files_count=$((updated_files_count + 1))

                            # Show the changes
                            echo "      📊 Changes made:"
                            diff "$yaml_file.bak" "$yaml_file" | head -5 | sed 's/^/        /' || true
                          else
                            echo "      ℹ️  No changes needed in $(basename "$yaml_file")"
                          fi
                        else
                          echo "      ⚠️  No build-to-release mapping available"
                        fi

                        rm -f "$yaml_file.bak"
                      fi
                    done

                    echo "  📊 Updated image references in $updated_files_count files"

                  else
                    echo "  ⚠️  Failed to extract chart tarball"
                  fi
                else
                  echo "  ⚠️  No chart tarball found in copied artifact"
                fi
              else
                echo "  ⚠️  Chart directory not found after copy"
              fi
            else
              echo "  ⚠️  Failed to copy Helm chart artifact"
            fi

            # Clean up temporary directory
            rm -rf "$extract_dir"

            # 🚀 PACKAGE AND PUSH THE UPDATED HELM CHART
            if [ -n "$helm_chart_repository" ]; then
              echo "  🚀 Packaging and pushing updated Helm chart to release repository..."

              # Create a working directory for the updated chart
              work_dir=$(mktemp -d)
              chart_extract_dir="$work_dir/chart_content"

              # Extract the original chart
              if skopeo copy --retry-times 3 "docker://$container_image" "dir:$work_dir/original" 2>/dev/null; then
                echo "    ✓ Downloaded original chart"

                # Find and extract the chart layer
                chart_tarball=""
                for file in "$work_dir/original"/*; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    if [[ "$filename" =~ ^[a-f0-9]{64}$ ]]; then
                      chart_tarball="$file"
                      break
                    fi
                  fi
                done

                if [ -n "$chart_tarball" ] && tar -xzf "$chart_tarball" -C "$work_dir" 2>/dev/null; then
                  echo "    ✓ Extracted chart content"

                  # Find the actual chart directory (should contain Chart.yaml)
                  chart_dir=""
                  for dir in "$work_dir"/*; do
                    if [ -d "$dir" ] && [ -f "$dir/Chart.yaml" ]; then
                      chart_dir="$dir"
                      break
                    fi
                  done

                  if [ -z "$chart_dir" ]; then
                    # If no Chart.yaml found in subdirs, check if it's in the root
                    if [ -f "$work_dir/Chart.yaml" ]; then
                      chart_dir="$work_dir"
                    fi
                  fi

                  if [ -n "$chart_dir" ]; then
                    echo "    ✓ Found chart directory: $(basename "$chart_dir")"

                    # Update image references in the chart
                    echo "    🔄 Updating image references..."
                    updated_files_count=0

                    find "$chart_dir" -name "*.yaml" -o -name "*.yml" | while read -r yaml_file; do
                      if grep -q "image:" "$yaml_file" 2>/dev/null; then
                        echo "      📝 Updating $(echo "$yaml_file" | sed "s|$chart_dir/||")"
                        cp "$yaml_file" "$yaml_file.bak"

                        if [ "$build_to_release_mapping" != "{}" ]; then
                          echo "$build_to_release_mapping" | jq -r 'to_entries[] | select(.value.release_repo != "") | "\(.value.build_repo) \(.value.release_repo)"' | while read -r build_repo release_repo; do
                            if [ -n "$build_repo" ] && [ -n "$release_repo" ]; then
                              echo "        🔄 Replacing $build_repo → $release_repo"
                              sed -i "s|$build_repo|$release_repo|g" "$yaml_file"
                              updated_files_count=$((updated_files_count + 1))
                            fi
                          done
                        fi
                      fi
                    done

                    echo "    📊 Updated image references in chart files"

                    # Package the chart using Helm
                    package_dir="$work_dir/packages"
                    mkdir -p "$package_dir"

                    echo "    📦 Packaging chart with Helm..."
                    if helm package "$chart_dir" -d "$package_dir" 2>/dev/null; then
                      echo "    ✅ Successfully packaged chart"

                      # Find the packaged chart file
                      chart_package=$(find "$package_dir" -name "*.tgz" | head -1)
                      if [ -n "$chart_package" ]; then
                        echo "    📦 Created package: $(basename "$chart_package")"

                        # Push the chart using Helm
                        echo "    🚀 Pushing chart to OCI registry..."
                        if helm push "$chart_package" "oci://$helm_chart_repository" 2>/dev/null; then
                          echo "    ✅ Successfully pushed chart to: oci://$helm_chart_repository"
                        else
                          echo "    ⚠️  Failed to push chart to: oci://$helm_chart_repository"
                        fi
                      else
                        echo "    ⚠️  No packaged chart file found"
                      fi
                    else
                      echo "    ⚠️  Failed to package chart with Helm"
                    fi
                  else
                    echo "    ⚠️  Could not find Chart.yaml in extracted content"
                  fi
                else
                  echo "    ⚠️  Failed to extract chart content"
                fi
              else
                echo "    ⚠️  Failed to download original chart"
              fi

              # Clean up work directory
              rm -rf "$work_dir"
            else
              echo "  ⚠️  No Helm chart repository configured - skipping packaging and push"
            fi

            # Add Helm chart info to processed charts with registry and digest info
            chart_info=$(echo "$component" | jq \
              --arg media_type "$media_type" \
              --argjson registry_destinations "$registry_destinations" \
              --arg pushed_digest "$pushed_digest" \
              --arg helm_chart_repository "$helm_chart_repository" \
              '. + {
                "detected_media_type": $media_type,
                "is_helm_chart": true,
                "content_extracted": true,
                "chart_packaged_with_helm": true,
                "helm_chart_repository": $helm_chart_repository,
                "registry_destinations": $registry_destinations,
                "pushed_digest": $pushed_digest
              }')
            processed_charts=$(echo "$processed_charts" | jq ". + [$chart_info]")

          else
            echo "  ℹ️  Not a Helm chart (mediaType: $media_type), skipping"
          fi
        done

        echo "$processed_charts" > "$(results.processedHelmCharts.path)"
        echo "Processed $(echo "$processed_charts" | jq length) Helm charts from $component_count total components"
        echo "Helm chart detection complete"

        # Set sourceDataArtifact result (required for trusted artifacts)
        echo -n "" > "$(results.sourceDataArtifact.path)"

    - name: create-trusted-artifact
      computeResources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          memory: 64Mi
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)

    - name: patch-source-data-artifact-result
      computeResources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 32Mi
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/patch-source-data-artifact-result/patch-source-data-artifact-result.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
